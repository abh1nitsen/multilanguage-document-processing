[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multilanguage-document-processing"
version = "0.1.0"
description = "Evidence-backed multilingual circular extraction and reviewed SQLite records"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7", "pypdfium2>=5,<6", "Pillow>=12,<14"]

[project.optional-dependencies]
demo = ["streamlit>=1.50,<2"]

[project.scripts]
document-processing = "document_processing.cli:main"

[tool.setuptools.packages.find]
include = ["document_processing*"]

[tool.setuptools.package-data]
document_processing = ["*.mjs"]
