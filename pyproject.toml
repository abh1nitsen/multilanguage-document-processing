[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circular-ledger"
version = "0.1.0"
description = "Evidence-backed multilingual circular extraction and reviewed SQLite records"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7", "pypdfium2>=5,<6", "Pillow>=12,<14"]

[project.optional-dependencies]
demo = ["streamlit>=1.50,<2"]
romanization = ["uroman>=1.3.1,<2"]

[project.scripts]
hindi-records = "hindi_records.cli:main"
circular-ledger = "hindi_records.cli:main"

[tool.setuptools.packages.find]
include = ["hindi_records*"]

[tool.setuptools.package-data]
hindi_records = ["*.mjs"]
